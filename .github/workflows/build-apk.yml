name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Android projesini hazırla
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: İkon ve açılış ekranını üret
        run: |
          pip install --quiet pillow
          cp assets/icon.jpg www/icon.jpg
          python3 scripts/icons.py

      - name: Android projesini eşitle
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Beyzalem.apk

      - name: APK'yı yükle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Beyzalem-APK
          path: Beyzalem.apk

      - name: Sürüm olarak yayınla (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Beyzâlem derleme ${{ github.run_number }}
          files: Beyzalem.apk
