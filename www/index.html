<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyzâlem</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0f3d3e,#14615f);color:#fff;text-align:center}
  h1{font-size:44px;margin:0 0 8px;letter-spacing:1px}
  p{opacity:.85;margin:0 0 32px}
  .row{display:flex;gap:14px}
  button{border:0;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;color:#fff}
  .ok{background:#2fb36f}.no{background:#d9534f}
  #msg{margin-top:24px;min-height:24px}
</style>
</head>
<body>
  <h1>Beyzâlem</h1>
  <p>Test sürümü — APK derleme denemesi</p>
  <div class="row">
    <button class="ok" onclick="msg.textContent='Beyzala! ✓'">Beyzala</button>
    <button class="no" onclick="msg.textContent='Beyzgeç ✗'">Beyzgeç</button>
  </div>
  <div id="msg"></div>
</body>
</html>
